<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Automation Dashboard</title>
<meta name="description" content="Swipe, script, produce, post, analyze and repurpose short videos from one dashboard, powered by GitHub Actions.">
<style>
:root{
  --bg:#0a0a0a; --panel:#141416; --panel-line:#232326; --ink:#fff; --mute:#8b8b93; --dim:#55555c;
  --accent:#ff5a14; --accent-soft:rgba(255,90,20,.14);
  --blue:#2146d9; --blue-soft:#e8edff; --green:#0e8a43; --green-soft:#dff5e7;
  --app-bg:#fff; --app-line:#e7e7ea; --app-ink:#17171a; --app-mute:#6c6c75; --app-sub:#f7f7f8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding:44px 48px 56px}

/* stage rail */
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:24px}
.rail button{text-align:left;padding:0 0 0;color:var(--dim);font-size:17px;position:relative}
.rail .bar{height:3px;background:#3a2a22;border-radius:2px;overflow:hidden;margin-bottom:18px}
.rail .bar i{display:block;height:100%;width:0;background:var(--accent)}
.rail button.done .bar i{width:100%}
.rail button.active .bar i{width:100%}
.rail button.active.playing .bar i{width:0;animation:fill var(--dur,6s) linear forwards}
@keyframes fill{to{width:100%}}
.rail .n{font-family:var(--mono);font-size:13px;margin-right:8px;color:var(--dim)}
.rail button.active{color:#fff}.rail button.active .n{color:var(--accent)}
.rail button:hover{color:#ddd}

/* hero card */
.card{margin-top:44px;background:var(--panel);border:1px solid var(--panel-line);border-radius:28px;padding:38px 40px;display:grid;grid-template-columns:minmax(260px,.62fr) 1.6fr;gap:44px;align-items:center;min-height:560px}
.copy .badge{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:14px;color:var(--mute)}
.copy .badge b{color:var(--accent);border:1px solid rgba(255,90,20,.45);background:var(--accent-soft);border-radius:6px;padding:3px 8px;font-weight:500}
.copy h1{font-size:clamp(38px,4.6vw,58px);letter-spacing:-.035em;line-height:1;margin:22px 0 14px;font-weight:700}
.copy p{font-size:21px;line-height:1.45;color:var(--mute);max-width:300px}
.cta{margin-top:30px;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-size:18px;padding:13px 24px;border-radius:12px;box-shadow:0 8px 28px rgba(255,90,20,.35);transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(255,90,20,.45)}
.next{margin-top:30px;display:inline-flex;align-items:center;gap:8px;border:1px solid #34343a;color:#d9d9de;font-size:15px;padding:10px 16px;border-radius:10px}
.next:hover{background:#1d1d20}.next b{font-weight:600;color:#fff}

/* app window */
.app{background:var(--app-bg);color:var(--app-ink);border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);min-width:0}
.chrome{display:flex;align-items:center;gap:22px;padding:12px 18px;border-bottom:1px solid var(--app-line);overflow-x:auto;scrollbar-width:none}
.chrome::-webkit-scrollbar{display:none}
.dots{display:flex;gap:8px}.dots i{width:13px;height:13px;border-radius:50%;background:#dcdce0}
.tabs{display:flex;gap:6px;align-items:center}
.tabs button{padding:7px 13px;border-radius:10px;font-size:15.5px;color:var(--app-mute);border:1px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--app-ink)}
.tabs button.on{color:var(--app-ink);border-color:#cfcfd5;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.gear{margin-left:auto;color:var(--app-mute);padding:6px;border-radius:8px}.gear:hover{background:#f0f0f2}
.pane{min-height:430px}
.bar-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--app-line);font-size:15px}
.bar-top .sp{margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--app-line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--app-mute);background:#fff}
.pill.warn{background:#fff0e8;color:#c2410c;border-color:#fff0e8}
.pill.ok{background:var(--green-soft);color:var(--green);border-color:var(--green-soft)}
.pill.info{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-soft)}
.mut{color:var(--app-mute)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--app-line);background:#fff;font-size:14px;color:var(--app-ink)}
.btn:hover{background:#f5f5f7}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.dark{background:#111;border-color:#111;color:#fff}.btn.dark:hover{background:#000}
.btn[disabled]{opacity:.55;cursor:not-allowed}
svg{display:block}

/* feed */
.feed{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;padding:18px}
.stack{position:relative;height:370px;display:flex;align-items:center;justify-content:center}
.reel{position:absolute;width:170px;height:290px;border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;font-weight:700;font-size:15px;line-height:1.15;box-shadow:0 18px 40px rgba(0,0,0,.28);transition:transform .35s}
.reel small{font-family:var(--mono);font-weight:500;font-size:11px;opacity:.85;margin-top:8px;display:flex;gap:8px}
.reel.a{background:linear-gradient(160deg,#6f45e8,#2b1b66);transform:translateX(-62px) rotate(-8deg)}
.reel.b{background:linear-gradient(160deg,#1c1c22,#0c0c10);transform:translateX(52px) rotate(7deg);z-index:2}
.reel .save{position:absolute;top:12px;right:12px;background:#1fa463;border-radius:6px;font-size:11px;padding:3px 7px}
.swipe-actions{position:absolute;bottom:-6px;z-index:3;display:flex;gap:14px}
.round{width:38px;height:38px;border-radius:50%;border:1px solid var(--app-line);display:grid;place-items:center;background:#fff}
.round.love{background:#1fa463;border-color:#1fa463;color:#fff}
.side{border:1px solid var(--app-line);border-radius:14px;padding:14px;background:var(--app-sub);display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--app-mute);text-transform:uppercase}
.saved-item{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #c7d2fb;border-radius:12px;padding:10px;box-shadow:0 0 0 3px #eef1ff}
.saved-item .ic{width:34px;height:34px;border-radius:8px;background:#111;display:grid;place-items:center;color:#fff;font-size:12px}
.chips{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chip{background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:3px 8px;font-size:12.5px}

/* script */
.script{display:grid;grid-template-columns:1.8fr 1fr;gap:16px;padding:18px}
.sline{padding:12px 14px;border-radius:10px;font-size:14.5px;line-height:1.5;margin-bottom:10px}
.sline.hook{background:var(--blue-soft);border-left:3px solid var(--blue)}
.sline.cmt{background:#e7f6ec;border-left:3px solid #1fa463}
.tag{font-size:11.5px;border-radius:4px;padding:2px 6px;margin-right:8px;background:#fff;color:var(--blue)}
.tag.g{color:#157a3f}
.checks{border:1px solid var(--app-line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:11px;font-size:13.5px;align-self:start}
.checks li{list-style:none;display:flex;gap:9px;align-items:center}
.tick{width:18px;height:18px;border-radius:50%;background:#1fa463;color:#fff;display:grid;place-items:center;flex:none}
textarea.edit{width:100%;min-height:150px;border:1px solid var(--app-line);border-radius:10px;padding:10px;font:inherit;font-size:14px;resize:vertical;margin-top:4px}
label.f{display:block;font-size:12px;color:var(--app-mute);margin-bottom:4px}
input.t,select.t{width:100%;border:1px solid var(--app-line);border-radius:8px;padding:9px 10px;font:inherit;font-size:14px;background:#fff}

/* production */
.prod{display:grid;grid-template-columns:190px 1fr;gap:18px;padding:18px}
.phone{height:340px;border-radius:14px;background:linear-gradient(180deg,#05060f,#0b1033);position:relative;overflow:hidden;color:#fff;padding:12px;font-size:12px}
.phone .cap{position:absolute;left:12px;right:12px;bottom:70px;font-size:19px;font-weight:700;line-height:1.15}
.phone .cap em{font-style:normal;background:#2146d9;padding:0 4px;border-radius:3px}
.steps{display:flex;flex-direction:column;gap:9px}
.step{display:flex;align-items:center;gap:12px;border:1px solid var(--app-line);border-radius:12px;padding:10px 12px;background:#fff;font-size:14px}
.step .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#eef1ff;color:var(--blue);flex:none}
.step b{font-weight:600;min-width:58px}
.step .st{margin-left:auto;flex:none;display:grid;place-items:center}
.spin{width:16px;height:16px;border:2px solid #cfd5ee;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.circle{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #d8d8de}
.render{border:1.5px solid #6d86f0;border-radius:12px;padding:12px;background:#fafbff}
.render .row{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.prog{height:6px;background:#dfe5fb;border-radius:4px;margin:10px 0;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
.log{font-family:var(--mono);font-size:11.5px;color:#55555c;line-height:1.55;height:96px;overflow:auto;white-space:pre-wrap}
.pfoot{display:flex;justify-content:space-between;align-items:center;padding:0 18px 16px;font-size:12.5px;color:var(--app-mute)}

/* calendar */
.cal{padding:18px;display:grid;grid-template-columns:repeat(4,1fr) 1.5fr;gap:12px;align-items:start}
.day{border:1px solid var(--app-line);border-radius:12px;padding:10px;font-size:12.5px;background:#fff;cursor:pointer;text-align:left;width:100%}
.day.sel{border-color:#7c91f2;box-shadow:0 0 0 3px #eef1ff}
.day .h{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.thumb{height:118px;border-radius:8px;margin-bottom:8px}
.sched{display:block;text-align:center;background:#f1f1f3;border-radius:6px;padding:4px;margin-top:6px;color:#55555c;font-size:12px}
.sched.posted{background:var(--green-soft);color:var(--green)}
.postcard{border:1px solid var(--app-line);border-radius:12px;padding:14px;background:var(--app-sub);font-size:13.5px;line-height:1.45}
.sw{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px}
.toggle{width:38px;height:22px;border-radius:999px;background:#d3d3d8;position:relative;transition:.2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.toggle.on{background:#2146d9}.toggle.on::after{left:18px}

/* analytics */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 18px}
.kpi{border:1px solid var(--app-line);border-radius:12px;padding:12px 14px;background:#fff}
.kpi .l{font-size:13px;color:var(--app-mute);display:flex;gap:6px;align-items:center}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.acct{display:grid;grid-template-columns:1.9fr 1fr;gap:14px;padding:0 18px 14px}
.box{border:1px solid var(--app-line);border-radius:14px;padding:14px 16px;background:#fff}
.box h4{font-size:14.5px;font-weight:600}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em}
.delta{display:inline-block;background:var(--green-soft);color:var(--green);border-radius:6px;padding:3px 9px;font-size:13px;margin-left:10px;vertical-align:middle}
.heat{display:grid;grid-template-columns:repeat(7,14px);gap:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:#eceef6}
.seg{display:inline-flex;border:1px solid var(--app-line);border-radius:9px;overflow:hidden}
.seg button{padding:5px 11px;font-size:13px;color:var(--app-mute)}.seg button.on{background:#f0f2fb;color:var(--app-ink)}
.top{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:0 18px 18px}
.treel{aspect-ratio:9/16;border-radius:10px;position:relative;overflow:hidden;color:#fff;padding:8px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px}
.treel .x{align-self:flex-start;background:#fff;color:var(--blue);border-radius:999px;padding:2px 8px;font-weight:600}
.treel .vw{font-weight:600;font-size:12px}
.treel .ttl{font-weight:700;font-size:11.5px;line-height:1.15;text-align:center;margin-top:10px}

/* carousels */
.winner{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--app-line)}
.car{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:14px 18px}
.mini{height:215px;border-radius:12px;background:linear-gradient(180deg,#000,#0c0f24);color:#fff;padding:10px;font-size:10px;position:relative}
.carbox{border:1.5px solid #8aa0f5;background:#f4f6ff;border-radius:14px;padding:12px}
.slides{display:flex;gap:10px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
.slide{flex:none;width:118px;height:156px;border:1px solid var(--app-line);border-radius:10px;background:#fff;padding:10px;display:flex;flex-direction:column;justify-content:space-between;font-weight:700;font-size:13px;line-height:1.2}
.slide .num{color:var(--blue);font-size:21px}
.slide.dark{background:#1d1d1f;color:#fff;border:0}
.slide.dark small{font-family:var(--mono);font-weight:400;opacity:.7}
.hooks{border:1px solid var(--app-line);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}
.hooks li{list-style:none;display:flex;gap:8px;align-items:center;margin-top:9px}

/* controls */
.ctl{display:flex;justify-content:center;gap:14px;margin-top:36px}
.ctl button{width:54px;height:54px;border-radius:50%;border:1px solid #2c2c31;background:#151518;display:grid;place-items:center}
.ctl button:hover{background:#202024}

/* modal */
dialog{margin:auto;border:1px solid #2c2c31;border-radius:18px;background:#fff;color:var(--app-ink);padding:0;width:min(520px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog form{padding:22px;display:flex;flex-direction:column;gap:12px}
dialog h3{font-size:18px}
dialog p.hint{font-size:12.5px;color:var(--app-mute);line-height:1.5}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1100px){
  .wrap{padding:28px 20px 40px}
  .rail{gap:10px}.rail button{font-size:13px}.rail .n{display:none}
  .card{grid-template-columns:1fr;padding:24px;gap:26px;min-height:0}
  .copy p{max-width:none;font-size:18px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .acct,.script,.feed,.prod,.car{grid-template-columns:1fr}
  .cal{grid-template-columns:repeat(2,1fr)}.cal .postcard{grid-column:1/-1}
  .top{grid-template-columns:repeat(3,1fr)}
  .phone{height:220px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="rail" id="rail" aria-label="Pipeline stages"></nav>

  <section class="card" id="card" aria-live="polite">
    <div class="copy" id="copy"></div>
    <div class="app" id="app"></div>
  </section>

  <div class="ctl">
    <button id="prev" aria-label="Previous stage"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="play" aria-label="Play or pause autoplay"></button>
    <button id="nextBtn" aria-label="Next stage"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
</div>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h3>Connect to GitHub Actions</h3>
    <p class="hint">Lets the Re-run button start your <b>generate-video</b> workflow. Values stay in this browser only (localStorage). Use a fine-grained token limited to this one repo with <b>Actions: read &amp; write</b>. Leave empty to run the built-in simulation.</p>
    <div><label class="f" for="sOwner">Owner</label><input class="t" id="sOwner" placeholder="your-github-username" autocomplete="off"></div>
    <div><label class="f" for="sRepo">Repository</label><input class="t" id="sRepo" placeholder="video-dashboard" autocomplete="off"></div>
    <div><label class="f" for="sBranch">Branch</label><input class="t" id="sBranch" placeholder="main" autocomplete="off"></div>
    <div><label class="f" for="sToken">Fine-grained token</label><input class="t" id="sToken" type="password" placeholder="github_pat_..." autocomplete="off"></div>
    <div class="btns">
      <button class="btn" value="clear" id="sClear" type="button">Clear</button>
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn primary" value="save" id="sSave">Save</button>
    </div>
  </form>
</dialog>

<script>

function areaChart(vals, {w=640,h=210,pad=30,ylab=true, dot=true}={}){
  const max = Math.max(...vals)*1.05, n = vals.length, iw = w-pad-8, ih = h-26;
  const pts = vals.map((v,i)=>[pad+ i*iw/(n-1), 8 + ih - v/max*ih]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line+` L${pts[n-1][0]} ${8+ih} L${pts[0][0]} ${8+ih} Z`;
  const steps = 4, grid = Array.from({length:steps+1},(_,i)=>{ const y = 8+ih - i*ih/steps; return `<line x1="${pad}" x2="${w-8}" y1="${y}" y2="${y}" stroke="#ececf1"/>${ylab?`<text x="${pad-6}" y="${y+4}" text-anchor="end" font-size="10.5" fill="#8b8b93">${i?fmt(max*i/steps):0}</text>`:""}`}).join("");
  const id = "g"+Math.random().toString(36).slice(2,7), last = pts[n-1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Trend chart"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2146d9" stop-opacity=".22"/><stop offset="1" stop-color="#2146d9" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#${id})"/><path d="${line}" fill="none" stroke="#2146d9" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dot?`<circle cx="${last[0]}" cy="${last[1]}" r="9" fill="#2146d9" opacity=".18"/><circle cx="${last[0]}" cy="${last[1]}" r="4" fill="#2146d9" stroke="#fff" stroke-width="1.5"/>`:""}</svg>`;
}

        <div><div class="big" style="font-size:26px">${a.posting.days}<span style="color:#aaa">/${a.posting.of}</span></div><div class="mut" style="font-size:12.5px">days with a reel</div><div class="big" style="font-size:26px;margin-top:8px">${a.posting.streak}</div><div class="mut" style="font-size:12.5px">day streak</div></div></div></div>
    </div></div>
  <div style="padding:0 18px 8px;font-weight:600;font-size:15px">Top reels</div>
  <div class="top">${a.top.map(([x,v,c1,c2],i)=>`<div class="treel" style="background:linear-gradient(170deg,${c1},${c2})"><span class="x">${esc(x)}</span><span class="vw">▶ ${esc(v)}</span></div>`).join("")}</div>`;
}
function vCar(){
  const r = D.repurpose;
  return `<div class="winner"><span class="pill warn" style="font-size:13px">${ICON.flame} Winner</span><b style="font-size:15px">${esc(r.winner)}</b><span class="sp mut" style="margin-left:auto;display:flex;gap:6px;align-items:center">${ICON.eye} ${esc(r.views)}</span></div>
  <div class="car">
    <div><div class="mini"><div style="text-align:center;margin-top:6px">If you're giving out<br>a free trial in 2026</div>
      <svg viewBox="0 0 100 60" style="position:absolute;left:0;right:0;bottom:22px;width:100%"><path d="M0 50 C30 50 45 46 58 30 S85 8 96 4" fill="none" stroke="#3b5bff" stroke-width="1.5"/></svg></div>
      <div style="text-align:center;margin-top:6px">${ICON.loop}</div></div>
    <div>
      <div class="carbox"><div style="display:flex;align-items:center;gap:10px;font-size:14px"><b>Carousel</b><span class="mut">${r.slides.length} slides</span><span class="pill ok sp" style="margin-left:auto">✓ Ready</span></div>
        <div class="slides">${r.slides.map((s,i)=> i===0 ? `<div class="slide dark"><small>SWIPE</small><span>${esc(s)}</span></div>` : `<div class="slide"><span class="num">${i}</span><span>${esc(s)}</span></div>`).join("")}</div></div>
      <div class="hooks"><b>New hooks</b> <span class="mut">from the winner</span><ul>${r.hooks.map(h=>`<li><span style="color:#2146d9">${ICON.spark}</span>${esc(h)}</li>`).join("")}</ul></div>
    </div>
  </div>`;
}
const VIEWS = [vFeed, vScript, vProd, vCal, vAnalytics, vCar];

function renderApp(){
  $("#app").innerHTML = chrome() + `<div class="pane">${VIEWS[stage]()}</div>`;
  wireApp();
}

/* ---------- navigation ---------- */
function render(){ renderRail(); renderCopy(); renderApp(); $("#play").innerHTML = playing
  ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>'
  : '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>'; }
function go(i){ stage = (i + D.stages.length) % D.stages.length; if(playing) schedule(); render(); }
function schedule(){ clearTimeout(timer); timer = setTimeout(()=>go(stage+1), DUR); }
function togglePlay(){ playing = !playing; if(playing) schedule(); else clearTimeout(timer); render(); }

/* ---------- Production pipeline (GitHub Actions or simulation) ---------- */
const cfg = () => ({ owner:store.get("gh.owner")||"", repo:store.get("gh.repo")||"", branch:store.get("gh.branch")||"main", token:store.get("gh.token")||"" });
const stamp = () => new Date().toLocaleTimeString("en-US");
function logLine(t){ run.log.push(`${stamp()}  ${t}`); const el=$("#log"); if(el){ el.textContent = run.log.join("\n"); el.scrollTop = el.scrollHeight; } }
function setProgress(p){ run.pct = p; const b=$("#rbar"), t=$("#rpct"); if(b) b.style.width = p+"%"; if(t) t.textContent = Math.round(p)+"%"; }
function refreshSteps(){ if(stage===2){ const keep = $(".pane").scrollTop; $(".pane").innerHTML = vProd(); wireApp(); } }

async function runPipeline(){
  if(run.running) return;
  const c = cfg();
  Object.assign(run,{running:true,pct:0,step:0,done:[false,false,false,false],log:[]});
  refreshSteps();
  if(c.owner && c.repo && c.token){ await dispatch(c); } else { await simulate(); }
}
async function simulate(){
  logLine("Pipeline started");
  logLine("No GitHub connection set. Running built-in simulation.");
  const secs = D.production.steps.map(s=>s.k);
  for(let i=0;i<secs.length;i++){
    run.step=i; refreshSteps(); logLine(`${secs[i]}: running`);
    await new Promise(r=>setTimeout(r,900));
    run.done[i]=true; setProgress((i+1)/secs.length*85); logLine(`${secs[i]}: done`);
  }
  run.step=-1; refreshSteps(); logLine("Render: encoding"); await new Promise(r=>setTimeout(r,900)); setProgress(100); logLine("Ready to Rip (simulated)");
  run.running=false; refreshSteps();
}
async function dispatch(c){
  const base = `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`;
  const H = { "Accept":"application/vnd.github+json","Authorization":`Bearer ${c.token}`,"X-GitHub-Api-Version":"2022-11-28" };
  try{
    logLine(`Dispatching workflow generate-video.yml on ${c.owner}/${c.repo}@${c.branch}`);
    const since = Date.now();
    const res = await fetch(`${base}/actions/workflows/generate-video.yml/dispatches`,{method:"POST",headers:{...H,"Content-Type":"application/json"},
      body: JSON.stringify({ ref:c.branch, inputs:{ topic:D.production.title, script:[D.script.hook,...D.script.body,D.script.comment].join("\n") } })});
    if(res.status!==204){ throw new Error(`GitHub answered ${res.status}: ${(await res.text()).slice(0,140)}`); }
    logLine("Workflow queued. Waiting for a run to appear");
    let runId=null;
    for(let i=0;i<20 && !runId;i++){
      await new Promise(r=>setTimeout(r,2500));
      const r = await fetch(`${base}/actions/workflows/generate-video.yml/runs?event=workflow_dispatch&per_page=3`,{headers:H});
      if(!r.ok) continue;
      const j = await r.json();
      const hit = (j.workflow_runs||[]).find(w=>new Date(w.created_at).getTime() >= since-60000);
      if(hit) runId = hit.id;
    }
    if(!runId) throw new Error("Run not found yet. Check the Actions tab on GitHub.");
    logLine(`Run #${runId} started`);
    for(let i=0;i<120;i++){
      await new Promise(r=>setTimeout(r,4000));
      const jr = await fetch(`${base}/actions/runs/${runId}/jobs`,{headers:H}); if(!jr.ok) continue;
      const jobs = (await jr.json()).jobs||[]; const steps = (jobs[0]&&jobs[0].steps)||[];
      const doneN = steps.filter(s=>s.status==="completed").length;
      setProgress(steps.length ? doneN/steps.length*100 : 5);
      const mapNames = ["Script","Voice","Visuals","Edit"];
      mapNames.forEach((n,k)=>{ const s = steps.find(x=>x.name.toLowerCase().includes(n.toLowerCase())); run.done[k] = !!(s && s.status==="completed"); });
      refreshSteps();
      const rr = await fetch(`${base}/actions/runs/${runId}`,{headers:H}); const info = await rr.json();
      if(info.status==="completed"){
        logLine(`Run finished: ${info.conclusion}`); logLine(info.html_url);
        if(info.conclusion==="success"){ run.done=[true,true,true,true]; setProgress(100); logLine("Ready to Rip. Download the video from the run's Artifacts."); }
        break;
      }
    }
  }catch(e){ logLine("Error: "+e.message); }
  run.running=false; refreshSteps();
}

/* ---------- wiring ---------- */
function wireApp(){
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>go(+b.dataset.t));
  document.querySelectorAll("[data-av]").forEach(b=>b.onclick=()=>{acctView=b.dataset.av==="1"; renderApp();});
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{selDay=+b.dataset.d; renderApp();});
  const on=(id,fn)=>{const e=$(id); if(e) e.onclick=fn;};
  on("#revoice",()=>go(1)); on("#toProduce",()=>go(2)); on("#toPost",()=>go(3));
  on("#rerun",()=>runPipeline());
  on("#webhook",openSettings); on("#gear",openSettings);
  on("#tgFeed",e=>{feedOn=!feedOn; renderApp();});
  on("#tgTrial",e=>{const t=e.currentTarget; const o=t.classList.toggle("on"); t.setAttribute("aria-checked",o);});
  const ed=$("#scriptEdit");
  if(ed) ed.oninput=()=>{ const L=ed.value.split("\n").map(x=>x.trim()).filter(Boolean);
    if(L.length>=2){ D.script.hook=L[0]; D.script.comment=L[L.length-1]; D.script.body=L.slice(1,-1); const s=$("#savedState"); if(s) s.textContent="Edited"; } };
}
function openSettings(){ const c=cfg(); $("#sOwner").value=c.owner; $("#sRepo").value=c.repo; $("#sBranch").value=c.branch; $("#sToken").value=c.token; $("#settings").showModal(); }
$("#settings").addEventListener("close",()=>{
  const v=$("#settings").returnValue;
  if(v==="save"){ store.set("gh.owner",$("#sOwner").value.trim()); store.set("gh.repo",$("#sRepo").value.trim()); store.set("gh.branch",$("#sBranch").value.trim()||"main"); store.set("gh.token",$("#sToken").value.trim()); }
});
$("#sClear").onclick=()=>{ ["owner","repo","branch","token"].forEach(k=>store.del("gh."+k)); $("#settings").close("clear"); };
$("#rail").addEventListener("click",e=>{ const b=e.target.closest("button[data-i]"); if(b) go(+b.dataset.i); });
$("#prev").onclick=()=>go(stage-1); $("#nextBtn").onclick=()=>go(stage+1); $("#play").onclick=togglePlay;
document.addEventListener("keydown",e=>{ if(e.target.closest("input,textarea,select,dialog")) return;
  if(e.key==="ArrowRight") go(stage+1); else if(e.key==="ArrowLeft") go(stage-1); else if(e.key===" "){ e.preventDefault(); togglePlay(); } });

/* ---------- boot: load data/state.json if present ---------- */
(async()=>{
  try{ if(location.protocol==="file:") throw 0; const r = await fetch("data/state.json",{cache:"no-store"}); if(r.ok){ const j = await r.json(); D = Object.assign({}, DEFAULT, j); } }catch{}
  render();
})();
})();
</script>
